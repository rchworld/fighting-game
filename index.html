<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>총검 아레나 (Gun & Sword Arena)</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#888; font-family: sans-serif; }
  canvas { display:block; }
  #crosshair {
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    background:#555; border-radius:50%; transform:translate(-50%,-50%);
    pointer-events:none; z-index:10;
  }
  #hud {
    position:absolute; top:10px; left:10px; color:#fff; text-shadow:0 0 4px #000;
    font-size:14px; z-index:10; line-height:1.5;
  }
  #timer {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:28px; text-shadow:0 0 4px #000; z-index:10;
  }
  #towers {
    position:absolute; top:10px; right:10px; color:#fff; text-shadow:0 0 4px #000;
    font-size:13px; z-index:10; text-align:right;
  }
  #overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; color:#fff; background:rgba(20,20,20,0.85); z-index:20;
    text-align:center;
  }
  #overlay.hidden { display:none; }
  .room-circle {
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:110px; height:110px; border-radius:50%; border:3px solid #ccc; margin:12px;
    cursor:pointer; background:rgba(255,255,255,0.08);
  }
  .room-circle:hover { background:rgba(255,255,255,0.25); }
  .item-btn {
    display:inline-block; width:90px; height:90px; margin:8px; border-radius:12px;
    border:2px solid #ccc; cursor:pointer; background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; text-align:center; font-size:13px;
  }
  .item-btn:hover, .item-btn.selected { background:rgba(255,220,120,0.4); }
  #msg { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:#fff; text-shadow:0 0 4px #000; z-index:10; font-size:15px; }
  #cooldownBar { position:absolute; bottom:44px; left:50%; transform:translateX(-50%);
    width:200px; height:8px; background:rgba(255,255,255,0.2); border-radius:4px; z-index:10; overflow:hidden;}
  #cooldownFill { height:100%; width:0%; background:#7fdcff; }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="timer"></div>
<div id="towers"></div>
<div id="msg"></div>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<div id="overlay"></div>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
